<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Auto-Cyborg 360</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0F1117;
      color: #E8EAED;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .badge {
      font-size: 10px;
      font-weight: 800;
      background: rgba(250, 204, 21, 0.15);
      color: #FACC15;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .status-card {
      background: #161923;
      border: 1px solid #262B40;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 11px;
    }
    .status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10B981;
      display: inline-block;
      margin-right: 4px;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #FACC15;
      color: #000;
      font-weight: bold;
      font-size: 11px;
      padding: 8px 0;
      border-radius: 6px;
      text-decoration: none;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="header">
    <strong style="font-size: 14px;">Auto-Cyborg 360</strong>
    <span class="badge">v1.0.0</span>
  </div>

  <div class="status-card">
    <div class="status-item">
      <span>Estado:</span>
      <span style="color: #10B981; font-weight: bold;"><span class="dot"></span>Activo</span>
    </div>
    <div class="status-item">
      <span>AutoApp Bridge:</span>
      <span style="color: #60A5FA;">Listo</span>
    </div>
  </div>

  <p style="font-size: 11px; color: #8B8FA8; margin-bottom: 12px; line-height: 1.4;">
    Puente DOM listo para recibir publicaciones desde el panel de AutoApp hacia Facebook Marketplace y WhatsApp Web.
  </p>

  <a href="http://localhost:3000/stock" target="_blank" class="btn">
    Abrir AutoApp Stock
  </a>
</body>
</html>
